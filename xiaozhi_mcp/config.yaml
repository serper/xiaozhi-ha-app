name: "Xiaozhi MCP - Open-Meteo and Lights"
slug: "xiaozhi_mcp"
description: "MCP Open-Meteo, iluminación, planificador, Tavily y sensores autorizados"
version: "0.5.0"
url: "https://github.com/serper/xiaozhi-ha-app"
image: "ghcr.io/serper/xiaozhi-ha-app"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
options:
  mcp_endpoint: ""
  country_code: "ES"
  light_zones: []
  sensor_catalog: []
  web_search_enabled: false
  web_search_depth: basic
  web_search_max_results: 5
  web_search_monthly_limit: 900
schema:
  mcp_endpoint: str
  country_code: str
  ha_access_token: password?
  web_search_enabled: bool
  tavily_api_key: password?
  web_search_depth: list(basic|advanced)
  web_search_max_results: int(1,10)
  web_search_monthly_limit: int(1,100000)
  light_zones:
    - zone: str
      entity_id: str
      aliases: str
      allow_read: bool
      allow_control: bool
  sensor_catalog:
    - name: str
      entity_id: str
      aliases: str
      allow_read: bool
