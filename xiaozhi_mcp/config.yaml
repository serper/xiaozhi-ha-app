name: "Xiaozhi MCP - Open-Meteo and Lights"
slug: "xiaozhi_mcp"
description: "MCP Open-Meteo, iluminación y planificador persistente"
version: "0.3.0"
url: "https://github.com/serper/xiaozhi-ha-app"
image: "ghcr.io/serper/xiaozhi-ha-app"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
options:
  mcp_endpoint: ""
  country_code: "ES"
  light_zones: []
schema:
  mcp_endpoint: str
  country_code: str
  ha_access_token: password?
  light_zones:
    - zone: str
      entity_id: str
      aliases: str
      allow_read: bool
      allow_control: bool
