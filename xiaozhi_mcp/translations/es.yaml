configuration:
  mcp_endpoint:
    name: "Endpoint MCP de Xiaozhi"
    description: "URL WebSocket privada wss:// del agente Xiaozhi"
  country_code:
    name: "País para meteorología"
    description: "Código ISO de dos letras, por defecto ES"
  ha_access_token:
    name: "Token de Home Assistant"
    description: "Token de acceso de larga duración de un usuario no administrador, necesario para las luces y los sensores autorizados"
  light_zones:
    name: "Catálogo de luces"
    description: "Entidades y alias autorizados para consulta y control"
    fields:
      zone:
        name: "Zona"
      entity_id:
        name: "Entidad de luz"
      aliases:
        name: "Alias de voz (separados por comas)"
      allow_read:
        name: "Permitir consulta"
      allow_control:
        name: "Permitir encender y apagar"

  web_search_enabled:
    name: "Búsqueda web"
    description: "Activar búsqueda pública mediante Tavily"
  tavily_api_key:
    name: "Clave API de Tavily"
    description: "Clave privada; necesaria solo al activar búsqueda"
  web_search_depth:
    name: "Profundidad"
    description: "Básica: 1 crédito; avanzada: 2"
  web_search_max_results:
    name: "Máximo de resultados"
    description: "Entre 1 y 10"
  web_search_monthly_limit:
    name: "Límite mensual local"
    description: "Créditos reservados por mes UTC"
  sensor_catalog:
    name: "Catálogo de sensores"
    description: "Sensores autorizados de solo lectura"
    fields:
      name:
        name: "Nombre"
      entity_id:
        name: "Entidad sensor o binary_sensor"
      aliases:
        name: "Alias de voz (separados por comas)"
      allow_read:
        name: "Permitir consulta"
