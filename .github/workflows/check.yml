name: Validate app

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q xiaozhi_mcp tests
      - name: Test lighting controls without HA access
        run: python -m unittest discover -s tests -v
      - name: Validate app metadata
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml
          app = yaml.safe_load(Path("xiaozhi_mcp/config.yaml").read_text())
          repository = yaml.safe_load(Path("repository.yaml").read_text())
          assert app["slug"] == "xiaozhi_mcp"
          assert app["version"] == "0.2.0"
          assert set(app["arch"]) == {"aarch64", "amd64"}
          assert app["image"] == "ghcr.io/serper/xiaozhi-ha-app"
          assert app["homeassistant_api"] is True
          assert app["options"]["light_zones"] == []
          assert repository["url"].endswith("/xiaozhi-ha-app")
          PY
