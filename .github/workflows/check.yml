name: Validate app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q xiaozhi_mcp
      - name: Validate add-on metadata
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml
          app = yaml.safe_load(Path("xiaozhi_mcp/config.yaml").read_text())
          repository = yaml.safe_load(Path("repository.yaml").read_text())
          assert app["slug"] == "xiaozhi_mcp"
          assert app["version"] == "0.1.1"
          assert "aarch64" in app["arch"]
          assert app["schema"]["mcp_endpoint"] == "str"
          assert repository["url"].endswith("/xiaozhi-ha-app")
          PY
